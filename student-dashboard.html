<!doctype html>
<html lang="en"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-XVCB9W38XJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XVCB9W38XJ');
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview — Ednivo Student</title>
<link rel="stylesheet" href="student-portal.css"><script src="supabase-config.js"></script><script src="db.js"></script><script src="auth.js"></script><script src="lead-storage.js"></script><script src="student-shell.js"></script><script src="site-engagement.js"></script></head>
<body data-portal="overview"><div class="student-app"><main class="student-main"><header class="student-top"><h1 data-page-title>Overview</h1><div class="top-actions"></div></header>
<section class="student-content"><div class="welcome"><div><h2>Welcome, <span id="studentName">Student</span> 👋</h2><p>Your account overview.</p></div></div>
<div class="grid2s" style="margin-top:16px">
  <div class="cardx"><span class="badge green">Payments</span><h3 style="margin-top:12px">Payment transactions</h3><div id="paymentHistory" class="muted" style="margin-top:12px">Loading…</div></div>
  <div class="cardx"><span class="badge orange">Score test</span><h3 style="margin-top:12px">Predicted SAT score</h3><div id="scoreResult" style="margin-top:12px"><p class="muted">Loading…</p></div></div>
</div></section></main></div>
<script>
window.addEventListener('ednivo:student-ready',async e=>{
 const p=e.detail;document.getElementById('studentName').textContent=(p.name||'Student').split(' ')[0];
 const ph=document.getElementById('paymentHistory');
 try{const tx=JSON.parse(localStorage.getItem('ednivo_payment_transactions')||'[]').filter(x=>!p.email||!x.email||x.email===p.email);ph.innerHTML=tx.length?`<table class="portal-table"><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr>${tx.map(x=>`<tr><td>${new Date(x.date||x.created_at||Date.now()).toLocaleDateString()}</td><td>${x.plan||'Ednivo program'}</td><td>${x.amount||'—'}</td><td>${x.status||'Paid'}</td></tr>`).join('')}</table>`:'No payment transactions yet.'}catch(x){ph.textContent='No payment transactions yet.'}
 const sr=document.getElementById('scoreResult');
 try{const d=await EDNIVO_DB.getMyDiagnostics(p.id),m=await EDNIVO_DB.getMyMocks(p.id);const latest=d[0]||m[0];if(latest){const score=latest.score_range||latest.score_estimate||latest.estimated_score||latest.total_score||'—';sr.innerHTML=`<div style="font-size:44px;font-weight:900;letter-spacing:-2px">${score}</div><p class="muted">Your latest Ednivo score-test result.</p><a class="btnx light" href="mocks.html">Take another score test →</a>`}else{sr.innerHTML='<p class="muted">You have not taken a score prediction test yet.</p><a class="btnx primary" href="mocks.html">Take test to predict my score →</a>'}}catch(x){sr.innerHTML='<p class="muted">You have not taken a score prediction test yet.</p><a class="btnx primary" href="mocks.html">Take test to predict my score →</a>'}
});
</script></body></html>
