</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI SAT Coach — Ednivo Student</title><link rel="stylesheet" href="student-portal.css"><script src="supabase-config.js"></script><script src="db.js"></script><script src="auth.js"></script><script src="product.js"></script><script src="student-shell.js"></script><script src="site-engagement.js"></script></head>
<body data-portal="ai"><div class="student-app"><main class="student-main"><header class="student-top"><h1 data-page-title>AI SAT Coach</h1><div class="top-actions"></div></header><section class="student-content"><div class="welcome"><div><h2>Understand your mistakes.</h2><p>Ask for a hint, explanation or next-step practice.</p></div></div><div class="grid2s"><div class="cardx"><span class="badge">Hint-first</span><h3 style="margin-top:12px">Ask your coach</h3><textarea id="q" rows="6" style="width:100%;padding:13px;border:1px solid #e5e9ed;border-radius:10px;margin-top:12px" placeholder="Paste a question or describe what confused you…"></textarea><select id="skill" style="width:100%;padding:13px;border:1px solid #e5e9ed;border-radius:10px;margin-top:10px"><option>Advanced Math</option><option>Algebra</option><option>Problem-Solving & Data Analysis</option><option>Geometry & Trigonometry</option><option>Information & Ideas</option><option>Craft & Structure</option><option>Expression of Ideas</option><option>Standard English Conventions</option></select><button class="btnx primary" id="ask" style="margin-top:12px">Explain it →</button></div><div class="cardx" id="answer"><span class="badge green">Coach</span><h3 style="margin-top:12px">Your explanation will appear here.</h3><p>Ednivo will guide your reasoning and recommend a focused next step.</p></div></div><h3 class="section-title">Recent practice</h3><div class="cardx" id="recent">Loading…</div></section></main></div>
<script>document.getElementById('ask').onclick=()=>{const skill=document.getElementById('skill').value;document.getElementById('answer').innerHTML=`<span class="badge green">Coach</span><h3 style="margin-top:12px">Let's break down ${skill}.</h3><p>First identify what the question is asking. Then write the rule, relationship, or evidence you need before looking at the answer choices. If one option feels familiar, check it against the exact wording.</p><p><b>Next move:</b> try a similar question without looking at the answer, then explain why each wrong option is wrong.</p><a class="btnx dark" href="practice.html">Practice this skill →</a>`};window.addEventListener('ednivo:student-ready',async e=>{try{const a=await EDNIVO_DB.getMyAttempts(e.detail.id);document.getElementById('recent').innerHTML=a.length?`<b>${a.length}</b> attempts saved · ${a.filter(x=>!x.correct).length} incorrect attempts available for review.`:'No practice history yet — complete a practice set to give your coach data.'}catch(x){document.getElementById('recent').textContent='Complete a practice set to start building your mistake history.'}})</script></body></html>
