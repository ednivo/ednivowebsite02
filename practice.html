<body data-portal="practice"><div class="student-app"><main class="student-main"><header class="student-top"><h1 data-page-title>Practice</h1><div class="top-actions"></div></header><section class="student-content"><div class="welcome"><div><h2>Practice what moves your score.</h2><p>Targeted questions based on your current skill profile.</p></div><span class="badge orange">8-question session</span></div>
<div class="cardx" id="box"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="badge" id="skill">Recommended</span><h3 id="question" style="font-size:24px;line-height:1.35;margin-top:12px">Loading your next question…</h3></div><span class="badge" id="count">1 / 8</span></div><div class="progress" style="margin:18px 0"><span id="prog"></span></div><div id="opts"></div><div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btnx light" id="hint">Need a hint</button><button class="btnx dark" id="submit" disabled>Check answer</button></div><div id="feedback" class="cardx" style="display:none;margin-top:18px;background:#f8fafb;box-shadow:none"></div></div>
<div id="done" class="cardx" style="display:none"><span class="badge green">Session complete</span><h3 style="font-size:24px;margin-top:12px">Nice work.</h3><p id="doneText"></p><a class="btnx primary" style="margin-top:15px" href="student-dashboard.html">See my progress →</a></div></section></main></div>
<style>.optionx{border:1px solid #e5e9ed;padding:14px;border-radius:10px;margin-top:9px;cursor:pointer;background:#fff}.optionx:hover{border-color:#0d5961}.optionx.selected{border-color:#ff6b2c;background:#fff6f1}</style>
<script>
window.addEventListener('ednivo:student-ready',async e=>{const u=e.detail;let attempts=[];try{attempts=await EDNIVO_DB.getMyAttempts(u.id)}catch(x){}let weak={};try{const d=await EDNIVO_DB.getMyDiagnostics(u.id);weak=(d[0]?.skill_map)||JSON.parse(localStorage.getItem('ednivo_last_diagnostic')||'{}').skill_map||{}}catch(x){}const order=EdnivoProduct.priority(weak).map(x=>x.skill);let candidates=EdnivoSAT.BANK.filter(q=>order.includes(q.skill));if(!candidates.length)candidates=EdnivoSAT.BANK.slice();let session=[],used=new Set();for(let i=0;i<8;i++){let pool=candidates.filter(q=>!used.has(q.id));if(!pool.length)pool=EdnivoSAT.BANK.filter(q=>!used.has(q.id));session.push(pool[Math.floor(Math.random()*Math.min(3,pool.length))]);used.add(session[i].id)}let i=0,selected=null,started=Date.now(),correctCount=0;const $=id=>document.getElementById(id);function render(){const q=session[i];$('skill').textContent=q.skill+' · '+(['','Easy','Medium','Hard'][q.d]||'Practice');$('question').textContent=q.q;$('count').textContent=`${i+1} / ${session.length}`;$('prog').style.width=((i+1)/session.length*100)+'%';$('opts').innerHTML=q.o.map((v,j)=>`<div class="optionx" data-i="${j}">${String.fromCharCode(65+j)}. ${v}</div>`).join('');$('submit').disabled=true;$('feedback').style.display='none';selected=null;started=Date.now();document.querySelectorAll('.optionx').forEach(o=>o.onclick=()=>{document.querySelectorAll('.optionx').forEach(z=>z.classList.remove('selected'));o.classList.add('selected');selected=+o.dataset.i;$('submit').disabled=false})} $('hint').onclick=()=>{const q=session[i];$('feedback').style.display='block';$('feedback').innerHTML='<b>Hint</b><p>'+q.e+'</p>'};$('submit').onclick=async()=>{const q=session[i],ok=selected===q.a,t=Math.round((Date.now()-started)/1000);if(ok)correctCount++;try{await EDNIVO_DB.savePracticeAttempt({user_id:u.id||null,question_id:q.id,subject:q.s,skill:q.skill,difficulty:q.d,correct:ok,is_correct:ok,time_seconds:t,error_type:EdnivoProduct.classifyError(ok,t,3),confidence:3})}catch(x){}$('feedback').style.display='block';$('feedback').innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b><p>${ok?'Good. Keep the pattern.':EdnivoProduct.tutor(q,q.o[selected],q.o[q.a],q.skill)}</p>`;if(i<session.length-1){$('submit').textContent='Next question →';$('submit').onclick=()=>{i++;$('submit').textContent='Check answer';render()}}else{$('submit').textContent='Finish session';$('submit').onclick=()=>{$('box').style.display='none';$('done').style.display='block';$('doneText').textContent=`You answered ${correctCount} of ${session.length} correctly. Your next session will continue to prioritize your weakest skills.`}}};render()});
</script></body></html>
